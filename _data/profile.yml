short_bio: >-
  <p>
    I am a Ph.D. candidate in Applied Demography at the University of Texas at San Antonio, where I work in Multimorbidity
    under the supervision of Dr. John Quarles. My research sits at the intersection 
    of extended reality and artificial intelligence, focusing on cybersickness prediction, cognitive load estimation, and 
    affective modeling in VR using multimodal physiological signals and deep learning.
  </p>
  <p>
    My work has been published in venues including IEEE TVCG, IEEE ISMAR, IEEE VR, and ACM VRST.
  </p>
  <p>
    Before joining UTSA, I worked as a Data Engineer at Bangladesh Bank and Robi Axiata, where I built large-scale 
    ETL pipelines and data analytics systems. I bring a strong foundation in PyTorch, TensorFlow, computer vision, and AR/VR development.
  </p>

