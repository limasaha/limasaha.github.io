short_bio: >-
  <p>
    I am a Ph.D. candidate in Applied Demography at the University of Texas at San Antonio, where I work in life course in Multimorbidity (Multiple Chronic Diseases) among US Older adults
    under the supervision of Dr. Fernando Riosmena. My research foucuses how childhood disadvantages impacts on onset of Multimorbidity among US older adults, and midlife advantages and 
    disadvantages has mediating effect in this association over time, among foreign-born vs US-born older adults in the US. Additionally, I want to compare cross-nationally to investigate the 
    cumulative disadavantges how it works for foreign-born vs US-born by considering two different country contexts.
  </p>
  <p>
    My work has been presented in venues including the Population Association of America (PAA), Sociology & Demography Research Colloquium, and First Annual HCAP Research Forum; Graduate 
    Student Appreciate Week Research (GSAW) Symposium; TexasPOP and International Conference on Aging in the Americas(ICAA).
  </p>
  <p>
    After joining UTSA, I worked as a Diversity, Equity, and Inclusion Summer Research Intern at American Institutes for Research, where I applied survey methodology and demographic analysis 
    to internal DEI datasets, contributing to organizational reports, policy briefs, and a manuscript on cultural/linguistic competence frameworks in survey design and delivery data-informed 
    DEI presentations for cross-functional staff; supported DEI symposium planning and facilitated orientation sessions. I also participated in the Cultural and Linguistic Competence Survey 
    Design and Methodology workshop. Additionally, I have received a scholarship for the Summer Institute on Longitudinal Data Analysis at The Methodology Center, Purdue University, West Lafayette,
