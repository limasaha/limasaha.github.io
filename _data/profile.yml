short_bio: >-
  <p>
    I am a Ph.D. candidate in Applied Demography at the University of Texas at San Antonio, where I work in life course in Multimorbidity (Multiple Chronic Diseases) among US Older adults
    under the supervision of Dr. Fernando Riosmena. My research foucuses how childhood disadvantages impacts on onset of Multimorbidity among US older adults, and midlife advantages and 
    disadvantages has mediating effect in this association over time, foreign-born vs US-born older adults in the US. Additionally, I want to compare cross-nationally to investigate the 
    cumulative disadavantges how it works for foreign-born vs US-born by considering two different country contexts.
  </p>
  <p>
    My work has been presented in venues including the Population Association of America (PAA), Sociology & Demography Research Colloquium, and First Annual HCAP Research Forum; Graduate 
    Student Appreciate Week Research (GSAW) Symposium; TexasPOP and International Conference on Aging in the Americas(ICAA).
  </p>
  <p>
    After joining UTSA, I worked as a Diversity, Equity, and Inclusion Summer Research Intern at American Institutes for Research 
  </p>

